<title>WILCO</title>
<script>window.WILCO_MODE = 'tablet';</script>
<style>
/* Lock screen: the only readable part of the published file. The app itself is encrypted below. */
:root{--bg:#08101F;--panel:#0D182D;--line:#30497A;--ink:#E4EBF8;--muted:#95A4C4;--accent:#43C6EC;--red:#FF5E66;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.4 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.lock{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.mark{display:flex;flex-direction:column;align-items:center;gap:10px}
.mark img{width:84px;height:84px;border-radius:19px}
.mark b{font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.16em}
h1{margin:0;font:600 17px/1.3 system-ui,-apple-system,sans-serif;color:var(--muted);text-align:center}
.dots{display:flex;gap:16px;height:18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.msg{min-height:22px;font-size:15px;color:var(--muted);text-align:center}
.msg.bad{color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,84px);gap:16px 24px}
.pad button{width:84px;height:84px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 32px/1 system-ui,-apple-system,sans-serif;cursor:pointer}
.pad button:active{background:var(--line)}
.pad button.txt{border:0;background:none;font-size:16px;color:var(--muted)}
.pad button:disabled{opacity:.4}
.word{display:flex;gap:10px;width:min(420px,100%)}
.word input{flex:1;min-width:0;padding:14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 18px/1 system-ui,-apple-system,sans-serif;-webkit-user-select:text;user-select:text}
.word input:focus{outline:none;border-color:var(--accent)}
.word button{padding:0 20px;border-radius:6px;border:0;background:var(--accent);color:#03131C;font:600 16px/1 system-ui,-apple-system,sans-serif}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head><body>
<main class="lock" id="lock" hidden>
  <div class="mark"><img src="icons/icon-192.png" alt=""><b>WILCO</b></div>
  <h1 id="prompt">Enter access code</h1>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <form class="word" id="word" hidden><input id="wordIn" type="password" autocomplete="off" autocapitalize="off" aria-label="Access code"><button>Unlock</button></form>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="pad" id="pad" hidden></div>
</main>

  var KEY = 'wilco.key', FAIL = 'wilco.lockfail';
  var $ = function(id){ return document.getElementById(id); };
  var code = '', busy = false;

  function bytes(b64){ var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function b64(a){ var s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }

  function derive(pass){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']).then(function(base){
      return crypto.subtle.deriveBits({name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iter, hash: 'SHA-256'}, base, 256);
    }).then(function(bits){ return new Uint8Array(bits); });
  }
  function decrypt(raw){
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function(key){
      return crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes(P.iv)}, key, bytes(CT));
    }).then(function(pt){ return new TextDecoder().decode(pt); });
  }
  function launch(html){ document.open(); document.write(html); document.close(); }

  if (!window.crypto || !crypto.subtle || !window.TextEncoder){
    document.body.innerHTML = '<p style="padding:32px;font-size:18px">WILCO must be opened from its https address or the Home Screen icon on iPadOS 15.4 or later.</p>';
    return;
  }

  // This iPad unlocked before: open straight away. A new passcode or build invalidates the saved key.
  var saved = get(KEY);
  if (saved){ decrypt(bytes(saved)).then(launch, function(){ set(KEY, null); ui(); }); }
  else ui();

  function ui(){
    $('lock').hidden = false;
    if (P.digits){
      $('pad').hidden = false;
      $('dots').innerHTML = new Array(P.len + 1).join('<i></i>');
      var keys = ['1','2','3','4','5','6','7','8','9','','0','del'];
      $('pad').innerHTML = keys.map(function(k){
        return k === '' ? '<span></span>' : k === 'del' ? '<button type="button" class="txt" data-k="del" aria-label="Delete">Delete</button>' : '<button type="button" data-k="' + k + '">' + k + '</button>';
      }).join('');
      $('pad').addEventListener('click', function(e){ var b = e.target.closest('[data-k]'); if (b) press(b.getAttribute('data-k')); });

      $('dots').hidden = true;
      $('word').hidden = false;
      $('word').addEventListener('submit', function(e){ e.preventDefault(); code = $('wordIn').value; if (code) attempt(); });

    }
    document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
    cooldown();
  }
  function paint(){ var d = $('dots').children; for (var i = 0; i < d.length; i++) d[i].className = i < code.length ? 'on' : ''; }
  function press(k){
    if (busy || waiting()) return;
    if (k === 'del') code = code.slice(0, -1);
    else if (code.length < P.len) code += k;
    paint();
    if (code.length === P.len) attempt();
  }
  function failState(){ try { return JSON.parse(get(FAIL)) || {n: 0, until: 0}; } catch (e) { return {n: 0, until: 0}; } }
  function waiting(){ return failState().until > Date.now(); }
  function cooldown(){
    var f = failState(), left = Math.ceil((f.until - Date.now()) / 1000);
    var btns = document.querySelectorAll('.pad button, .word button');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = left > 0;
    if (left > 0){ say('Too many attempts. Try again in ' + left + ' s.', true); setTimeout(cooldown, 1000); }
    else if (f.until) say('');
  }
  function say(t, bad){ $('msg').textContent = t; $('msg').className = 'msg' + (bad ? ' bad' : ''); }
  function attempt(){
    busy = true; say('Checking…');
    derive(code).then(function(raw){
      return decrypt(raw).then(function(html){ set(KEY, b64(raw)); set(FAIL, null); launch(html); });
    }).catch(function(){
      busy = false; code = ''; paint(); $('wordIn').value = '';
      var f = failState(); f.n += 1;
      if (f.n >= 5) f.until = Date.now() + 30000 * Math.pow(2, f.n - 5);   // 30 s, 1 min, 2 min…

      var box = P.digits ? $('dots') : $('word');
      box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      say('Incorrect code.', true);
      cooldown();
    });
